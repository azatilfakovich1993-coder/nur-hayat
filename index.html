<!DOCTYPE html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#070710" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nur Hayat" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/nur-hayat/icons/apple-touch-icon.png" />
    <!--
      Шрифты подгружаются НЕ блокируя отрисовку.

      Обычный <link rel="stylesheet"> задерживает первый кадр до тех пор, пока
      файл не придёт. Серверы Google в мобильных сетях РФ недоступны (браузер на
      телефоне прямо пишет "нет интернета", хотя до нашего сервера доходит за
      72 мс), поэтому приложение ждало таймаута и показывало ЧЁРНЫЙ ЭКРАН 30-40
      секунд при первом запуске — без единой надписи, даже без "Загрузка…" ниже.
      Многие успевали закрыть приложение, решив, что оно не работает.

      Приём с media="print" — стандартный: браузер считает такой файл нужным
      только для печати и не задерживает из-за него отрисовку, а после загрузки
      onload переключает его на все виды вывода. Не пришёл — не беда, текст
      покажется системным шрифтом (запасные прописаны в --font-ui/--font-arabic).
    -->
    <link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=Scheherazade+New:wght@400;500;600;700&display=swap" />
    <title>Nur Hayat · نور حياة</title>
    <script type="module" crossorigin src="/nur-hayat/assets/index-DYZ8y07O.js"></script>
    <link rel="stylesheet" crossorigin href="/nur-hayat/assets/index-DZUlRQp-.css">
  <link rel="manifest" href="/nur-hayat/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/nur-hayat/registerSW.js"></script></head>
  <body>
    <div id="root">
      <div id="js-fallback" style="height:100vh;background:#070710;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;font-family:sans-serif">
        <div style="color:#C9A84C;font-size:20px">نور حياة</div>
        <div style="color:rgba(255,255,255,0.5);font-size:14px;text-align:center" id="js-status">Загрузка...</div>
      </div>
    </div>
    <script>
      // Эта заставка живёт только до запуска приложения — потом React заменяет
      // её собой, и элемента js-status больше нет. Строка со style стояла ВНЕ
      // проверки на его существование, поэтому сам обработчик падал с ошибкой
      // «Cannot read properties of null», перекрывая собой настоящую причину.
      // Из-за этого любая ошибка в работающем приложении выглядела в журнале
      // одинаково и бесполезно.
      function showStartupError(text) {
        var el = document.getElementById('js-status');
        if (!el) return;
        el.innerHTML = text;
        el.style.color = '#ff6b6b';
      }
      window.addEventListener('error', function(e) {
        showStartupError('⚠️ Ошибка JS: ' + (e.message || e) + '<br><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>');
      });
      window.addEventListener('unhandledrejection', function(e) {
        showStartupError('⚠️ Ошибка: ' + (e.reason?.message || e.reason || 'Unknown'));
      });
    </script>
  </body>
</html>
